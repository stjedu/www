<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的教學小站</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft JhengHei", sans-serif; background: #f4f7f8; color: #183849; line-height: 1.8; }
    header { padding: 64px 24px; background: #123343; color: white; }
    .wrap { max-width: 960px; margin: auto; }
    header p { color: #d5e5e8; }
    main { padding: 32px 24px 56px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    section { padding: 24px; background: white; border: 1px solid #dce4e7; border-radius: 12px; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 8px 0; }
    h2 { font-size: 1.3rem; margin-top: 0; }
    a { color: #95471f; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #95471f; outline-offset: 4px; }
    footer { text-align: center; padding: 20px; color: #5c7280; }
  </style>
</head>
<body>
  <header><div class="wrap">
    <p>TEACHING LAB · 教師個人網站</p>
    <h1>王老師的教學小站</h1>
    <p>歡迎來到我的課堂，這裡整理課程教材與學習資源。</p>
  </div></header>
  <main class="wrap"><div class="grid">
    <section><h2>關於老師</h2><p>請在這裡寫下任教科目與教學理念。</p></section>
    <section><h2>課程教材</h2><p>放上講義、練習題或學習單連結。</p><a href="https://stjedu.github.io/www/" target="_blank" rel="noopener noreferrer">研習教材網站</a></section>
    <section><h2>學習資源</h2><p>把常用的教學工具集中在這裡。</p><a href="https://docs.github.com/zh/pages" target="_blank" rel="noopener noreferrer">GitHub Pages 官方說明</a></section>
  </div></main>
  <footer>我的第一個 GitHub Pages 教學網站</footer>
</body>
</html>
